name: Triage YouTube request

on:
  issues:
    types: [opened]

permissions:
  issues: write

jobs:
  triage:
    if: contains(github.event.issue.labels.*.name, 'youtube-request')
    runs-on: ubuntu-latest
    steps:
      - name: Explain the approval flow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment "${{ github.event.issue.number }}" \
            --repo "${{ github.repository }}" \
            --body "Thanks for the request! A maintainer needs to review this before it's processed — that happens by adding the \`approved\` label. Only people with write access to this repo can add labels, so this step can't be bypassed. You'll get a comment here once it's approved and published (or if something went wrong, e.g. the video has no English captions)."
